name: Crypto 247 Sniper

on:
  schedule:
    - cron: '0 * * * *' # Jalan unggal 1 jam (Crypto aktif 24/7)
  workflow_dispatch:

jobs:
  run-crypto:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Ieu wajib aya supados tiasa nge-push hasil training AI
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Crypto Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main_crypto.py

      - name: Auto-Save AI Memory
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.csv *.pkl *.json 2>/dev/null || true
          git commit -m "🧠 Crypto AI Brain Update: BTC, SOL, ETH" || echo "No changes"
          git push
